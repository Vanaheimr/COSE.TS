name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          - os:   windows-latest
            node: '22'
          - os:   macos-latest
            node: '22'

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Everything from the lock file, the CBOR codec included: since
      # @vanaheimr/metrological-cbor shipped, it arrives here the way it
      # arrives everywhere. The nightly is what installs without the lock
      # file, and the conformance suite is what still builds from source.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The same artifact a release would publish, assembled on every push
      # rather than on release day — bundle, declarations, and the tidied
      # source map comment that tests/bundle.test.ts then asserts.
      - name: Build
        run: npm run build

      # RFC 9052 C.2.1/C.1.1/C.1.2, RFC 9338 A.2.1, RFC 6979 A.2.5, the
      # brainpoolP320r1 parameters of RFC 5639 and the worked signed record of
      # the Metrological CBOR specification — every one of them a byte string
      # somebody else published.
      - name: Test against the published vectors
        run: npm test

      # Typedoc validates while it renders: a symbol reachable from the API
      # and not exported, or a doc link that goes nowhere, fails this step
      # rather than shipping as a broken page.
      - name: Generate the API reference
        run: npm run docs:api
