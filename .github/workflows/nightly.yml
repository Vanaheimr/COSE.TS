name: Nightly

# The counterpart to ci.yml, and here it is a genuine drift detector rather
# than the same run on a timer. This repository's foundations — the CBOR
# codec and the @noble libraries — are versioned npm releases that every pull
# request installs from the lock file. This job installs them without one, so
# a release cut yesterday breaks these tests overnight rather than at the
# next lock file bump. Drift in the codec's *unreleased* master is the
# cross-signing conformance suite's to catch: that repository builds both
# implementations from source, which is its job and no longer this one's.
#
# Two things worth knowing about scheduled workflows: they only ever run on the
# default branch, and GitHub disables them after 60 days without any repository
# activity. If this stops reporting, that is the first thing to check.
on:
  schedule:
    # 03:37 UTC. Not on the hour: GitHub's scheduler is busiest then and delays
    # runs by tens of minutes.
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  verify:
    name: Full verification on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24', 'latest']

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies without the lock file
        # Catches breakage introduced by new releases of the dependencies —
        # and of the curve library in particular, where a changed default has
        # already cost this project a day: @noble/curves normalises ECDSA's
        # `s` to its low form unless told otherwise, and COSE does not.
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test against the published vectors
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=moderate
